<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Колесо ФРТОШКИ</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/page.css">
</head>
<body>
  <div class="maze-root spin">
    <div class="spin-bg" aria-hidden="true"></div>
    <div class="spin-snow" aria-hidden="true"></div>
    <svg class="spin-branch spin-branch--left" viewBox="0 0 120 200" aria-hidden="true">
      <path d="M34 192 C46 128 40 74 62 18" fill="none" stroke="#8d6a32" stroke-width="3" stroke-linecap="round"/>
      <path fill="#1b4332" d="M62 16 L84 50 L40 50 Z"/>
      <path fill="#245c40" d="M54 44 L90 88 L26 88 Z"/>
      <path fill="#1b4332" d="M46 80 L98 132 L16 132 Z"/>
      <path fill="#2d6a4f" d="M38 118 L104 176 L10 176 Z"/>
      <circle cx="82" cy="72" r="6" fill="#ed1c24"/>
      <circle cx="28" cy="128" r="5" fill="#f6c445"/>
      <circle cx="74" cy="154" r="5" fill="#f58220"/>
    </svg>
    <svg class="spin-branch spin-branch--right" viewBox="0 0 120 200" aria-hidden="true">
      <path d="M34 192 C46 128 40 74 62 18" fill="none" stroke="#8d6a32" stroke-width="3" stroke-linecap="round"/>
      <path fill="#1b4332" d="M62 16 L84 50 L40 50 Z"/>
      <path fill="#245c40" d="M54 44 L90 88 L26 88 Z"/>
      <path fill="#1b4332" d="M46 80 L98 132 L16 132 Z"/>
      <path fill="#2d6a4f" d="M38 118 L104 176 L10 176 Z"/>
      <circle cx="82" cy="72" r="6" fill="#214091"/>
      <circle cx="28" cy="128" r="5" fill="#ed1c24"/>
      <circle cx="74" cy="154" r="5" fill="#f6c445"/>
    </svg>
    <div class="spin-lights" aria-hidden="true"></div>
    <header class="spin-top">
      <div>
        <h1>Колесо ФРТОШКИ</h1>
        <p>Крути — справа выедет новогоднее предсказание</p>
      </div>
      <span class="maze-header__badge">Новый год</span>
    </header>

    <main class="spin-layout">
      <section class="spin-stage">
        <div class="spin-wheel-wrap">
          <div class="spin-frt">
            <img src="assets/img/frtoshka.svg" alt="">
          </div>
          <div class="spin-rotor" id="rotor">
            <svg id="wheel" viewBox="0 0 500 500" aria-hidden="true"></svg>
          </div>
          <div class="spin-hub" aria-hidden="true">
            <b></b>
            <span style="--x:24px;--y:-16px;--d:0s"></span>
            <span style="--x:-22px;--y:-14px;--d:.4s"></span>
            <span style="--x:18px;--y:20px;--d:.8s"></span>
            <span style="--x:-16px;--y:22px;--d:1.2s"></span>
            <span style="--x:2px;--y:-28px;--d:.2s"></span>
          </div>
        </div>
        <button class="spin-go" id="spin" type="button">Крутить</button>
      </section>

      <aside class="spin-aside">
        <article class="maze-panel maze-panel--visible" id="card">
          <div class="spin-card-head">
            <div class="maze-panel__label">Предсказание</div>
            <svg class="spin-wreath" viewBox="0 0 64 64" aria-hidden="true">
              <circle cx="32" cy="30" r="16" fill="none" stroke="#1b4332" stroke-width="8"/>
              <circle cx="32" cy="30" r="16" fill="none" stroke="#3d8b5f" stroke-width="2.5" stroke-dasharray="2 4"/>
              <circle cx="22" cy="22" r="2.4" fill="#ed1c24"/>
              <circle cx="42" cy="20" r="2.2" fill="#f6c445"/>
              <circle cx="40" cy="38" r="2.2" fill="#f58220"/>
              <path fill="#ed1c24" d="M26 44 h12 l-2 8 h-8 z"/>
              <circle cx="32" cy="46" r="2.4" fill="#f6c445"/>
            </svg>
          </div>
          <h2 class="maze-panel__term" id="card-title">Крути колесо</h2>
          <p class="maze-panel__text" id="card-text">ФРТОШКА уже сидит сверху и машет. Нажми кнопку — колесо выберет пожелание само.</p>
        </article>
      </aside>
    </main>
  </div>
  <script src="js/wheel.js"></script>
</body>
</html>
